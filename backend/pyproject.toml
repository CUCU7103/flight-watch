[project]
name = "flight-watch-backend"
version = "0.1.0"
description = "Flight Watch scanner backend."

license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "fastapi>=0.115,<1",
    "google-genai>=2.31,<3",
    "httpx[http2]>=0.28,<1",
    "redis>=6,<8",
    "uvicorn>=0.32,<1",
]

[project.scripts]
flight-scanner = "flight_scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_ultrafast", "src/flight_scanner"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/flight_scanner"]
check_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
